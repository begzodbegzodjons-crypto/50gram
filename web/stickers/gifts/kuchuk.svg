<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><style>.b{animation:bb 1.4s ease-in-out infinite;transform-origin:100px 130px}@keyframes bb{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.ear{transform-box:fill-box;transform-origin:top center;animation:er 1.6s ease-in-out infinite}@keyframes er{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}.tong{animation:tg .9s ease-in-out infinite;transform-origin:top center}@keyframes tg{0%,100%{transform:scaleY(.7)}50%{transform:scaleY(1.15)}}</style><g class="b"><path d="M56 84q-8-38 10-40 16-2 22 30z" fill="#8d5a2b" class="ear"/><path d="M144 84q8-38-10-40-16-2-22 30z" fill="#8d5a2b" class="ear" style="animation-delay:.4s"/><circle cx="100" cy="120" r="50" fill="#c68642"/><ellipse cx="100" cy="138" rx="26" ry="20" fill="#eac393"/><g class="tong"><path d="M100 150v14q0 8-8 8" stroke="#e05656" stroke-width="9" fill="none" stroke-linecap="round"/></g><circle cx="82" cy="112" r="6.5" fill="#2b2b2b"/><circle cx="118" cy="112" r="6.5" fill="#2b2b2b"/><circle cx="84" cy="110" r="2.2" fill="#fff"/><circle cx="120" cy="110" r="2.2" fill="#fff"/><ellipse cx="100" cy="132" rx="8" ry="6" fill="#2b2b2b"/></g></svg>