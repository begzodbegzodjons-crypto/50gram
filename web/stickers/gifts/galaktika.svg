<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><style>.sp{animation:rot 9s linear infinite;transform-origin:100px 100px}@keyframes rot{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}.s1{animation:tw 1.6s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}.s2{animation:tw 1.6s ease-in-out .5s infinite}.s3{animation:tw 1.6s ease-in-out 1s infinite}.core{animation:pu 2s ease-in-out infinite;transform-origin:100px 100px}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}</style><circle cx="100" cy="100" r="82" fill="#1a1a2e"/><g class="sp"><ellipse cx="100" cy="100" rx="74" ry="26" fill="none" stroke="#845ef7" stroke-width="10" opacity=".7"/><ellipse cx="100" cy="100" rx="74" ry="26" fill="none" stroke="#4dabf7" stroke-width="7" opacity=".55" transform="rotate(60 100 100)"/><ellipse cx="100" cy="100" rx="74" ry="26" fill="none" stroke="#f06595" stroke-width="6" opacity=".5" transform="rotate(120 100 100)"/></g><circle cx="100" cy="100" r="22" fill="#ffd43b" class="core"/><circle cx="100" cy="100" r="12" fill="#fff3bf"/><g fill="#fff"><circle cx="48" cy="58" r="3" class="s1"/><circle cx="152" cy="62" r="2.6" class="s2"/><circle cx="60" cy="146" r="2.4" class="s3"/><circle cx="146" cy="140" r="3" class="s1" style="animation-delay:.8s"/><circle cx="100" cy="34" r="2.4" class="s2"/><circle cx="36" cy="104" r="2.2" class="s3"/></g></svg>