.tear1{animation:tfall 1.6s infinite}.tear2{animation:tfall 1.6s .5s infinite}
@keyframes tfall{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(26px)}}
</style><ellipse cx="100" cy="184" rx="46" ry="9" fill="#0e1330" opacity=".14"/>
<circle cx="100" cy="100" r="88" fill="url(#gl)" opacity=".5"/>
