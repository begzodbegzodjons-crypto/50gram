name = "50gram"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Frontend (web/) shu Worker bilan birga joylanadi: https://50gram.<sizning-subdomen>.workers.dev
[assets]
directory = "../web"
binding = "ASSETS"
# /50gram.apk worker orqali o'tadi — Content-Disposition: attachment qo'shiladi (majburiy yuklab olish)
# / va /index.html ham worker orqali — Cache-Control: no-cache (APK WebView eski sahifa ko'rmasin)
run_worker_first = ["/api/*", "/50gram.apk", "/", "/index.html"]

# Real-time: har foydalanuvchiga bitta Durable Object (Free planda SQLite backend bilan ishlaydi)
[[durable_objects.bindings]]
name = "USER_SOCKET"
class_name = "UserSocket"

# SEC FIREWALL — doimiy IP-bloklanganlar ombori (bitta "global" nusxa, SQLite)
[[durable_objects.bindings]]
name = "SEC"
class_name = "SecFirewall"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserSocket"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SecFirewall"]

# Har 30 daqiqada TEXNIK chiqindilarni tozalaydi: eskirgan OTP kodlari, pin-joblar,
# qo'ng'iroq signal navbati, o'lik qo'ng'iroq yozuvlari. XABARLAR/FAYLLAR/ISTORIYA
# O'CHMAYDI (o'chmas tarix — cleanup() ichidagi izohga qarang, v71 hujjat-mosligi)
[triggers]
crons = ["*/30 * * * *"]

# Workers AI: trend lentada tarjima uchun (subrequest limitiga kirmaydi)
[ai]
binding = "AI"

[observability]
enabled = true

[vars]
# =====================================================================
# SMS REJIMI (MASTER-SWITCH) — hozircha "app":
#   "app"   = kod ilova ICHIDA QIZIL yozuvda beriladi (haqiqiy SMS YO'Q).
#             Foydalanuvchilar ko'payguncha shu rejim — bepul, hech narsa buzilmaydi.
#   "eskiz" = haqiqiy SMS (Eskiz.uz orqali). Uni yoqish uchun:
#             1) shu yerdagi qiymatni "eskiz" ga almashtiring;
#             2) ESKIZ_EMAIL va ESKIZ_PASSWORD secretlar qo'shilganini tekshiring
#                (npx wrangler secret list — ro'yxatda bo'lishi kerak);
#             3) Eskiz kabinetida balans borligini tekshiring;
#             4) git push — deploy avtomatik, keyin bir raqamga kirib sinang.
#             ESKIZ_FROM / SMS_TEXT ixtiyoriy (default: 4546 va standart matn).
# =====================================================================
SMS_MODE = "app"
# DEV_MODE="1" + SMS_MODE="app": kod HAR QANDAY raqamga ilova ICHIDA qaytadi (dev_code —
# QIZIL yozuv). Yangi raqam ro'yxatdan o'tadi, logout qilgan ega qaytadi. v73 QURILMA-MOS
# qo'riq: raqam qurilma guvohnomasiga (x-dev) bog'lanadi — EGASI o'z qurilmasidan HAR DOIM
# kiradi (409 YO'Q); boshqa qurilma faol hisobga 409 «tarmoqda mavjud» oladi, lekin
# «Bu mening raqamim» tugmasi bilan (force) kod olib kira oladi — eski qurilma o'zi chiqadi.
# Qotib qolgan raqam holati (938607999) abadiy yo'q qilindi.
# SMS_MODE="eskiz" bo'lganda bu maydon o'zi ishdan chiqadi (kod faqat haqiqiy SMS
# bilan boradi) — uni "0" qilish SHART EMAS.
DEV_MODE = "1"
# DEV kod qo'shimcha imtiyoz: shu raqamlar «band» qoidasidan tashqari — doim kiradi
DEV_PHONES = "+998907776655,+998900000003,+998900000004,+998900000005,+998900000006"
# Sinov raqamlari (SMS yuborilmaydi): "+998900000001:111111,+998900000002:222222"
TEST_PHONES = ""
# FOYDALANUVCHI MANBALARI (Reels bo'limi — manba nomi klientga KO'RINMAYDI, mahfiy):
# MY_YT: YouTube kanal ID (UC...) yoki @handle, vergul bilan ajratilgan. Shorts tabi olinadi.
# MY_IG: Instagram profil nomi (ochiq/public akkaunt bo'lishi shart), vergul bilan.
# reels + rasmlar avtomatik olinib, algoritm bo'yicha Reels lentaSiga aralashtiriladi.
# FOYDALANUVCHINING O'Z KANALI: "Begzod1985 Begzodjon" (@begzodbegzodjon).
# PAROL KERAK EMAS — kanal ochiq (public), shorts tabi server tomonidan o'qiladi (RSS-uslub).
# Kanal hozircha BO'SH: birinchi shorts yuklanishi bilan ular AVTOMATIK (30 daqiqaga qadar)
# Reels/Shorts lentaSiga chiqadi — HAMMA foydalanuvchi ko'radi, lentaSning boshida.
MY_YT = "UCAUIQJqBsu4SCNLjHHMHV7g"
MY_IG = ""
# IG serveri Cloudflare IP'larini bloklasa — foydalanuvchi brauzeridan olingan 'sessionid'
# cookie qiymatini secret qilib qo'shish kerak: npx wrangler secret put MY_IG_COOKIE

# Secretlar (terminalda bir marta):
#   npx wrangler secret put DATABASE_URL     # TiDB Cloud -> Connect -> Serverless Driver URL
#   npx wrangler secret put JWT_SECRET       # kamida 32 ta tasodifiy belgi
#   npx wrangler secret put ESKIZ_EMAIL      # eskiz.uz login
#   npx wrangler secret put ESKIZ_PASSWORD
# Ixtiyoriy (qo'ng'iroqlar har qanday tarmoqda ulanishi uchun TURN):
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_KEY_TOKEN
