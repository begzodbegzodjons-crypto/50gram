name: Panel E2E (maxfiy admin)
on:
  workflow_dispatch:
concurrency:
  group: testlar-zanjiri
  cancel-in-progress: false
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Maxfiy admin panel API qatlamini jonli sinov
        env:
          E2E_BASE: https://50gram.uz
        run: node scripts/e2e_panel.mjs
