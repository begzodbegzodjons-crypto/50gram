name: Broadcast tashxis (egaga)
on:
  workflow_dispatch:
concurrency:
  group: testlar-zanjiri
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Broadcast/adm_log/err_jurnal jonli o'qish
        env:
          E2E_BASE: https://50gram.begzodbegzodjons.workers.dev
        run: node scripts/diag_broadcast.mjs
