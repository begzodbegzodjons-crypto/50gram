name: Butun ilova AUDITI (barcha funksiyalar)
on:
  workflow_dispatch:
concurrency:
  # smoke/e2e bilan BITTA zanjir — audit ularga parallel tushsa, bir xil test
  # raqamlari bilan bir-birining sessiyasini o'chirib 401-bo'roni berardi
  # (isbot: b20e254 audit run 37263374213 — 10 QIZIL hammasi 401).
  group: testlar-zanjiri
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright o'rnatish (chromium)
        run: |
          cd scripts
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.63.0 --no-audit --no-fund >/dev/null
          npx playwright install chromium
          npx playwright install-deps chromium >/dev/null || sudo npx playwright install-deps chromium
      - name: To'liq audit — jonli saytga qarshi
        env:
          E2E_BASE: https://50gram.begzodbegzodjons.workers.dev
        run: node scripts/audit_full_app.mjs
      # JURNAL O'QISH (bir runner = bir IP): audit endi o'z IP'sini fw4xx bilan bloklamaydi
      # (probe-istisno) — shu IP'dan darhol err_jurnal o'qiladi: server 500'lari + klient
      # qo'ng'iroq jurnallari. Tashxis vositasi — o'qib bo'lmasa audit QIZIL BO'LMASIN.
      - name: err_jurnal + klient qo'ng'iroq jurnallarini o'qish
        if: always()
        continue-on-error: true
        env:
          E2E_BASE: https://50gram.begzodbegzodjons.workers.dev
        run: node scripts/jurnal_read.mjs
