name: Jonli tekshiruv (smoke)
on:
  workflow_dispatch:
  push:
    branches:

      - main
concurrency:
  group: testlar-zanjiri
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: To'liq E2E tekshiruv (deploy'dan keyin avtomatik, o'zini tozalaydi)
        run: |
          set -e
          sleep 90  # deploy tugashini kutish (npm ci + wrangler deploy ~1-2 daqiqa)
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          BASE="https://50gram.begzodbegzodjons.workers.dev"
          TOK=""
          TOK2=""
          cleanup() {
            if [ -n "$TOK" ]; then curl -s -A "$UA" -H "authorization: Bearer $TOK" -X POST "$BASE/api/auth/logout" -H 'content-type: application/json' -d '{}' >/dev/null || true; fi
            if [ -n "$TOK2" ]; then curl -s -A "$UA" -H "authorization: Bearer $TOK2" -X POST "$BASE/api/auth/logout" -H 'content-type: application/json' -d '{}' >/dev/null || true; fi
          }
          trap cleanup EXIT
          H=$(curl -s -A "$UA" "$BASE/api/health"); echo "health: $H"
          echo "$H" | grep -q '"ok":true' || { echo "FAIL health"; exit 1; }
          # 1) KIRISH (test raqami — dev kod ilova-ichki rejim)
          O=$(curl -s -A "$UA" -X POST "$BASE/api/auth/otp" -H 'content-type: application/json' -d '{"phone":"998900000003"}')
          echo "$O" | grep -q '"ok":true' || { echo "FAIL otp: $O"; exit 1; }
          CODE=$(echo "$O" | python3 -c "import sys,json;print(json.load(sys.stdin)['dev_code'])")
          V=$(curl -s -A "$UA" -X POST "$BASE/api/auth/verify" -H 'content-type: application/json' -d "{\"phone\":\"+998900000003\",\"code\":\"$CODE\"}")
          TOK=$(echo "$V" | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          MYUID=$(echo "$V" | python3 -c "import sys,json;print(json.load(sys.stdin)['user']['id'])")
          AUTH="authorization: Bearer $TOK"
          echo "verify: OK (user $MYUID)"
          # 2) YADRO endpointlar — v58 parallel so'rovlar
          curl -s -A "$UA" -H "$AUTH" "$BASE/api/me" | grep -q '"id"' || { echo "FAIL me"; exit 1; }
          curl -s -A "$UA" -H "$AUTH" "$BASE/api/chats" | grep -q '"chats"' || { echo "FAIL chats"; exit 1; }
          D=$(curl -s -A "$UA" -H "$AUTH" -X POST "$BASE/api/chats/direct" -H 'content-type: application/json' -d "{\"user_id\":$MYUID}")
          CID=$(echo "$D" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          echo "direct: OK"
          M=$(curl -s -A "$UA" -H "$AUTH" -X POST "$BASE/api/chats/$CID/messages" -H 'content-type: application/json' -d '{"body":"smoke","client_id":"smoke1"}')
          MID=$(echo "$M" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          echo "send: OK"
          curl -s -A "$UA" -H "$AUTH" "$BASE/api/chats/$CID/messages?latest=80" | grep -q '"messages"' || { echo "FAIL msgs"; exit 1; }
          curl -s -A "$UA" -H "$AUTH" "$BASE/api/stories" >/dev/null || { echo "FAIL stories"; exit 1; }
          curl -s -A "$UA" -H "$AUTH" "$BASE/api/lives" >/dev/null || { echo "FAIL lives"; exit 1; }
          curl -s -A "$UA" -H "$AUTH" "$BASE/api/search?q=a" | grep -q '"users"' || { echo "FAIL search"; exit 1; }
          curl -s -A "$UA" -H "$AUTH" "$BASE/api/discover" >/dev/null || { echo "FAIL discover"; exit 1; }
          curl -s -A "$UA" -H "$AUTH" "$BASE/api/wallet" | grep -q '"coins"' || { echo "FAIL wallet"; exit 1; }
          curl -s -A "$UA" -H "$AUTH" "$BASE/api/users/$MYUID" | grep -q '"id"' || { echo "FAIL user"; exit 1; }
          echo "messages/chats/me/stories/lives/search/discover/wallet/user: OK"
          # ============ QO'NG'IROQ SIGNALING E2E (LOCK — qayta buzilmasin) ============
          # Ikki akkaunt bilan to'liq signalizatsiya zanjiri: yaratish → yetkazish (pending)
          # → offer (navbat orqali — WS o'lsa ham KAFOLAT) → statuslar. Qo'ng'iroq qatlami
          # regressiyaga uchrasa bu test QIZIL yonadi (deploy'dan keyin avtomatik).
          O2=$(curl -s -A "$UA" -X POST "$BASE/api/auth/otp" -H 'content-type: application/json' -d '{"phone":"998900000004"}')
          echo "$O2" | grep -q '"ok":true' || { echo "FAIL otp2: $O2"; exit 1; }
          CODE2=$(echo "$O2" | python3 -c "import sys,json;print(json.load(sys.stdin)['dev_code'])")
          V2=$(curl -s -A "$UA" -X POST "$BASE/api/auth/verify" -H 'content-type: application/json' -d "{\"phone\":\"+998900000004\",\"code\":\"$CODE2\"}")
          TOK2=$(echo "$V2" | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          UID2=$(echo "$V2" | python3 -c "import sys,json;print(json.load(sys.stdin)['user']['id'])")
          AUTH2="authorization: Bearer $TOK2"
          echo "verify2: OK (user $UID2)"
          # VERSION LOCK: build qorovuli (BUILD_V == __50BUILD == sw V) — 3 martagacha kutamiz
          BV=""; BV_EXP=$(grep -o "50gram-v[0-9]*" web/sw.js | head -1 | grep -oE "[0-9]+$")
          for i in 1 2 3 4 5 6; do
            BV=$(curl -s -A "$UA" "$BASE/api/build" | python3 -c "import sys,json;print(json.load(sys.stdin).get('v',''))" 2>/dev/null || true)
            [ "$BV" = "v$BV_EXP" ] && break
            sleep 20
          done
          [ "$BV" = "v$BV_EXP" ] || { echo "FAIL build (kutildi: v$BV_EXP, olindi: '$BV')"; exit 1; }
          echo "build: v$BV_EXP OK"
          # 1) QO'NG'IROQ YARATISH
          C1=$(curl -s -A "$UA" -H "$AUTH" -X POST "$BASE/api/calls" -H 'content-type: application/json' -d "{\"to\":$UID2,\"video\":true}")
          CID1=$(echo "$C1" | python3 -c "import sys,json;print(json.load(sys.stdin)['call_id'])")
          [ -n "$CID1" ] && [ "$CID1" != "None" ] || { echo "FAIL call create: $C1"; exit 1; }
          echo "call create: OK ($CID1)"
          # 2) YETKAZISH: qabul qiluvchining pending'ida ko'rinadi (bir marta qilinganda yetadi)
          P=$(curl -s -A "$UA" -H "$AUTH2" "$BASE/api/calls/pending")
          echo "$P" | grep -q "\"call_id\":$CID1" || { echo "FAIL pending: $P"; exit 1; }
          echo "call pending: OK"
          # 3) SIGNAL NAVBATI: offer yuboriladi va qabul qiluvchi navbat orqali ALBATTA oladi
          curl -s -A "$UA" -H "$AUTH" -X POST "$BASE/api/signal" -H 'content-type: application/json' -d "{\"to\":$UID2,\"data\":{\"k\":\"offer\",\"call_id\":$CID1,\"sdp\":{\"type\":\"offer\",\"sdp\":\"v=0\"}}}" | grep -q '"ok":true' || { echo "FAIL signal post"; exit 1; }
          Q=$(curl -s -A "$UA" -H "$AUTH2" "$BASE/api/signal/queue?since=0")
          echo "$Q" | grep -q '"k":"offer"' || { echo "FAIL signal queue: $Q"; exit 1; }
          echo "signal queue: OK"
          # 4) STATUSLAR: active → yakuniy status (call_closed bildirishnomasi manbasi)
          curl -s -A "$UA" -H "$AUTH2" -X POST "$BASE/api/calls/$CID1/status" -H 'content-type: application/json' -d '{"status":"active"}' | grep -q '"ok":true' || { echo "FAIL call active"; exit 1; }
          curl -s -A "$UA" -H "$AUTH2" -X POST "$BASE/api/calls/$CID1/status" -H 'content-type: application/json' -d '{"status":"ended"}' | grep -q '"ok":true' || { echo "FAIL call ended"; exit 1; }
          # 5) TOZALANGANLIK: yakunlangan qo'ng'iroq pending'da QAYTMASLIGI kerak (ghost yo'q)
          sleep 1
          P2=$(curl -s -A "$UA" -H "$AUTH2" "$BASE/api/calls/pending")
          echo "$P2" | grep -q "\"call_id\":$CID1" && { echo "FAIL ghost: pending qaytardi: $P2"; exit 1; }
          echo "call status + no-ghost: OK"
