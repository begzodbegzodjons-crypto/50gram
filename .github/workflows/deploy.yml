name: Deploy 50 Gram
on:
  push:
    branches:

      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: O'rnatish
        working-directory: worker
        run: npm install
      # v79: R2 bucket mavjudligini kafolatlash (birinchi deploy'da yaratiladi, keyin
      # «allaqachon bor» bo'lib o'tadi). Token R2 ruxsatiga ega bo'lmasa — deploy BARIBIR
      # uriniladi: worker kodi BUCKET binding bo'lmasa eski D1-yo'liga o'zi qaytadi.
      - name: R2 bucket kafolati (50gram-files)
        working-directory: worker
        run: npx wrangler r2 bucket create 50gram-files || echo "bucket allaqachon bor yoki ruxsat yo'q"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Cloudflare'ga joylash
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
